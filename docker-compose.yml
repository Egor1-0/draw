version: '3.9'

services:
  bot:
    build: 
      context: .
      dockerfile: Dockerfile.bot
    container_name: bot
    restart: unless-stopped
    depends_on:
      - db
      - redis
  db:
      image: postgres
      container_name: postgres_db
      environment:
        POSTGRES_USER: username
        POSTGRES_PASSWORD: secretpassword
        POSTGRES_DB: socnet
      ports:
        - "5433:5433"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
